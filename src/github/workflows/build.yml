name: Build Geode Mod

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [ "main" ] # Se ejecuta automáticamente al subir cambios a main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar el mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64 # Cambia a Android32 si tu móvil es de 32 bits

      - name: Subir el .geode como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: InputAssist-geode
          path: ${{ steps.build.outputs.build-output }}
